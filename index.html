<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
    <!-- Importamos Three.js y sus complementos desde un CDN confiable -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="loading-ui">Estado: Inicializando escena...</div>
    <div id="canvas-container"></div>

    <script>
        // --- 1. CONFIGURACIÓN BÁSICA DE LA ESCENA ---
        const container = document.getElementById('canvas-container');
        const statusUi = document.getElementById('loading-ui');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222); // Fondo gris oscuro para contrastar

        // Cámara con amplio rango de visión (Far en 1000 para no cortar objetos grandes)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Controles de órbita para poder mover la cámara con el mouse
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. ILUMINACIÓN (Esencial para que el modelo no se vea negro) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
        mainLight.position.set(10, 20, 15);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
        fillLight.position.set(-10, -10, -10);
        scene.add(fillLight);

        // --- 3. OBJETO DE PRUEBA (Para descartar fallos generales) ---
        // Si ves este cubo verde pero no tu modelo, el problema es 100% la ruta o el archivo del modelo.
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const testCube = new THREE.Mesh(geometry, material);
        testCube.position.set(-2, 0, 0); // Lo movemos a la izquierda
        scene.add(testCube);

        // --- 4. CARGA DEL MODELO 3D ---
        const loader = new THREE.GLTFLoader();
        
        // ¡IMPORTANTE!: Recuerda NO usar una barra diagonal "/" al inicio de tu ruta.
        // Usa rutas relativas puras como 'assets/tu_modelo.glb' o './modelos/objeto.gltf'
        const RUTA_DEL_MODELO = 'assets/tu_modelo.glb'; 

        statusUi.innerText = "Estado: Cargando modelo 3D...";

        loader.load(
            assets/FleaRig3.gltf,
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                // TRUCO AVANZADO: Auto-encuadrar el modelo sin importar su escala original
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Reseteamos el modelo al centro exacto de la pantalla
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                // Ajustamos la cámara dinámicamente para que apunte al tamaño del modelo
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 4 * Math.tan(fov * 2));
                cameraZ *= 2.5; // Factor de espacio alrededor del objeto

                camera.position.set(center.x, center.y + (maxDim * 0.2), cameraZ);
                camera.lookAt(center);
                controls.target.copy(center);
                controls.update();

                statusUi.innerText = "Estado: ¡Modelo cargado con éxito!";
                console.log("Modelo cargado correctamente:", model);
            },
            function (xhr) {
                // Progreso de descarga en consola
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    statusUi.innerText = `Estado: Descargando (${percent}%)`;
                }
            },
            function (error) {
                statusUi.innerText = "Estado: Error al cargar el modelo (Ver consola F12)";
                console.error("Error detallado de Three.js:", error);
            }
        );

        // --- 5. BUCLE DE ANIMACIÓN (RENDER LOOP) ---
        function animate() {
            requestAnimationFrame(animate);

            // Hacemos girar el cubo de prueba para verificar que el bucle funciona
            if (testCube) {
                testCube.rotation.x += 0.01;
                testCube.rotation.y += 0.01;
            }

            controls.update(); // Requerido para OrbitControls damping
            renderer.render(scene, camera);
        }
        animate();

        // --- 6. AJUSTE DE PANTALLA RESPONSIVO ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
